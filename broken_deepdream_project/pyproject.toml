[project]
name = "deepdream-langgraph"
version = "2.0.0"
description = "基于 LangGraph + PyTorch 的 DeepDream 梦境生成助手"
authors = [
    {name = "DeepDream Team"},
]
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.6",
    "langchain==1.3.11",
    "langchain-core>=0.3.0",
    "dashscope>=1.20.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "gradio>=4.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
]

[project.scripts]
deepdream = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepdream*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
