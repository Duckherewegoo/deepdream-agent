[project]
name = "deepdream-langgraph"
version = "2.0.0"
description = "基于 LangGraph + PyTorch 的 DeepDream 梦境生成助手"
authors = [
    {name = "DeepDream Team"},
]
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "dashscope",
    "torch",
    "torchvision",
    "Pillow",
    "numpy",
    "gradio",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[project.scripts]
deepdream = "main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepdream*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
