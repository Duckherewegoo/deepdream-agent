[project]
name = "deepdream-langgraph"
version = "2.1.0"
description = "基于 LangGraph + PyTorch 的 DeepDream 梦境生成助手"
readme = "README.md"
authors = [
    {name = "DakeGinger"},
]
requires-python = ">=3.10"
dependencies = [
    # 核心框架
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-core>=0.3.0",
    "dashscope>=1.20.0",
    
    # 深度学习与图像处理
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    
    # Web UI
    "gradio>=4.0.0",
    
    # 工具与网络
    "typing-extensions>=4.5.0",
    "requests>=2.28.0",
    "PyJWT>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.8.0",
]

[project.scripts]
deepdream = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ⚠️ 注意：如果你的源码实际在 `src/` 下面，这里可能需要改为：
# where = ["src"]
# include = ["agent*", "config*", "core*", "deepdream*", "node*", "state*", "tools*", "utils*", "infra*", "services*", "ui*"]
[tool.setuptools.packages.find]
where = ["."]
include = ["deepdream*"]

# ========== 代码格式化与检查 ==========

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "E501",    # 行长度超限（由 Black 自动处理，且你的系统提示词很长）
    "BLE001",  # 允许捕获宽泛的 Exception（在节点兜底时非常必要）
    "RUF001",  # 允许中文全角标点
    "RUF002",  # 允许 Docstring 中的全角标点
    "RUF003",  # 允许注释中的全角标点
    "RUF012",  # 允许类属性中的可变默认值（我们在配置类中大量使用了 dict）
    "B008",    # 允许函数默认参数调用（常用于 LangChain 或 Gradio）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许 __init__.py 中导入但不使用（作为包的暴露出口）
"tests/*" = ["S101"]      # 允许在测试中使用 assert

# ========== 测试配置 ==========

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v -s"
